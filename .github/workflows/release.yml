name: Release ZIP

# Builds a ZIP that installs through Moodle's plugin installer and attaches it to a GitHub release.
# The ZIP's top folder must be named after the plugin. Runs when a release is published on GitHub
# (Releases > Draft a new release), or when a v* tag is pushed.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build the plugin ZIP
        run: git archive --format=zip --prefix=reflectivejournal/ -o assignsubmission_reflectivejournal.zip HEAD

      - name: Attach the ZIP to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assignsubmission_reflectivejournal.zip --clobber
          else
            gh release create "$TAG" assignsubmission_reflectivejournal.zip --title "$TAG" --generate-notes
          fi
